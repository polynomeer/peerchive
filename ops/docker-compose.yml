# Peerchive 로컬 개발용 PostgreSQL(+ 선택: ClamAV, Mailpit, MinIO). 운영 환경 설정이 아닙니다.
# 사용: docker compose -f ops/docker-compose.yml up -d
#       ClamAV까지: docker compose -f ops/docker-compose.yml --profile clamav up -d
#       (처음 시작할 때 서명 DB를 내려받느라 몇 분 걸리고 메모리를 1GB 이상 씁니다.)
#       SMTP 시험(Mailpit): docker compose -f ops/docker-compose.yml --profile mailpit up -d --wait mailpit
#       S3 호환 저장소 시험(MinIO): docker compose -f ops/docker-compose.yml --profile minio up -d --wait minio
#       선택 서비스는 profile을 지정할 때만 뜹니다(기본 `up`에는 postgres만).
# 값은 저장소 루트 .env(.env.example 복사본) 또는 아래 기본값(로컬 전용)을 씁니다.
name: peerchive

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peerchive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peerchive}
      POSTGRES_DB: ${POSTGRES_DB:-peerchive}
    ports:
      # 로컬 루프백에만 바인딩합니다.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - peerchive-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 파일 악성코드 검사(clamd). worker에서 PEERCHIVE_MALWARE_SCANNER=clamav, CLAMAV_PORT로 연결합니다(ADR 0007).
  clamav:
    image: clamav/clamav:1.4.3
    profiles: ["clamav"]
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    volumes:
      - peerchive-clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  # SMTP 시험 서버(ADR 0017). 받은 메일을 저장만 하고 밖으로 보내지 않습니다. 웹 화면·API: http://127.0.0.1:${MAILPIT_HTTP_PORT:-8025}
  # TLS 없는 로컬 SMTP라 앱에서는 PEERCHIVE_SMTP_ALLOW_INSECURE=1(개발 전용, production 거부)이 필요합니다.
  mailpit:
    image: axllent/mailpit:v1.31.4
    profiles: ["mailpit"]
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3 호환 저장소 시험(ADR 0017). 로컬 전용 계정(.env.example의 MINIO_ROOT_*)이며 운영 값이 아닙니다.
  # API: http://127.0.0.1:${MINIO_API_PORT:-9000}, 관리 화면: http://127.0.0.1:${MINIO_CONSOLE_PORT:-9001}
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-peerchive-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-peerchive-local-only}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - peerchive-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  peerchive-pg-data:
  peerchive-clamav-db:
  peerchive-minio-data:
